name: Telegram Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    # Dependabot pull requests get no repository secrets: skip what needs them
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/reusable-telegram.yml
    secrets: inherit
