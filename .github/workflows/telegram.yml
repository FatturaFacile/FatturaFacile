name: Telegram Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Telegram Message
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 <b>Repository:</b> ${{ github.repository }}
            👤 <b>Actor:</b> ${{ github.actor }}
            📌 <b>Event:</b> ${{ github.event_name }}
            🌿 <b>Ref:</b> ${{ github.ref_name }}
            🔗 <a href="${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a>
          format: html
