# Shared Telegram notification for every FatturaFacile repository.
#
# Usage (.github/workflows/telegram.yml in the calling repo):
#
#   on:
#     push:
#       branches: [ main ]
#     pull_request:
#       types: [ opened, closed, reopened ]
#     issues:
#       types: [ opened, closed, reopened ]
#   jobs:
#     notify:
#       uses: FatturaFacile/FatturaFacile/.github/workflows/reusable-telegram.yml@main
#       secrets: inherit
#
# Needs the TELEGRAM_CHAT_ID and TELEGRAM_TOKEN secrets (org or repo level).
name: Reusable - Telegram Notification

on:
  workflow_call:
    inputs:
      status:
        description: Optional pipeline result shown in the message (e.g. "SUCCESS ✅")
        type: string
        default: ''

permissions: {}

jobs:
  notify:
    name: Notify Telegram
    # Pull requests from forks get no repository secrets: skip
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # Build the message in a shell step: event fields come in through env, never inline in the script
      - name: Compose message
        id: msg
        env:
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref_name }}
          STATUS: ${{ inputs.status }}
          LINK: ${{ github.event.pull_request.html_url || github.event.issue.html_url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
        run: |
          {
            echo 'text<<EOF_MSG'
            echo "🚀 <b>Repository:</b> $REPO"
            echo "👤 <b>Actor:</b> $ACTOR"
            echo "📌 <b>Event:</b> $EVENT${ACTION:+ ($ACTION)}"
            echo "🌿 <b>Ref:</b> $REF"
            if [ -n "$STATUS" ]; then echo "📊 <b>Status:</b> $STATUS"; fi
            echo "🔗 <a href=\"$LINK\">Open on GitHub</a>"
            echo 'EOF_MSG'
          } >> "$GITHUB_OUTPUT"

      - name: Send Telegram Message
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: ${{ steps.msg.outputs.text }}
